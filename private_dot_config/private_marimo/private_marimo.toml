[snippets]
include_default_snippets = true
custom_paths = []

[package_management]
manager = "uv"

[ai.models]
custom_models = []
autocomplete_model = "openai/gpt-5"
displayed_models = []

[ai.custom_providers]

[keymap]
preset = "default"

[keymap.overrides]

[formatting]
line_length = 80

[save]
format_on_save = true
autosave = "after_delay"
autosave_delay = 1000

[runtime]
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"
default_csv_encoding = "utf-8"
on_cell_change = "autorun"
output_max_bytes = 8000000
auto_instantiate = false
auto_reload = "off"
reactive_tests = true
default_sql_output = "auto"

[display]
default_width = "compact"
theme = "system"
code_editor_font_size = 14
default_table_max_columns = 50
default_table_page_size = 10
reference_highlighting = true
cell_output = "below"
dataframes = "rich"

[language_servers.pylsp]
enable_flake8 = false
enabled = false
enable_pyflakes = false
enable_ruff = true
enable_pylint = false
enable_pydocstyle = false
enable_mypy = true

[server]
follow_symlink = false
browser = "default"

[completion]
signature_hint_on_typing = true
activate_on_typing = true
copilot = "custom"

[mcp]
presets = ["marimo"]

[mcp.mcpServers]

[diagnostics]
sql_linter = true
